<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    * {
        margin: 0px auto;
        padding: 0px;
    }
    
    .wrapper {
        width: 180px;
        height: 200px;
        padding: 20px;
        border: 1px solid #000;
        margin-top: 50px;
        font-size: larger;
        background-color: antiquewhite;
    }
</style>

<body>
    <div class="wrapper">
        <form>
            <input type="text" id="txtus" placeholder="User name">
            <br>
            <input type="password" id="txtmk" placeholder="Password">
            <br>
            <input type="radio" name="gt" value="Nam">Nam
            <input type="radio" name="gt" value="Nữ">Nữ
            <br>
            <input type="checkbox" value="Trà vải">Trà vải
            <br>
            <input type="checkbox" value="Trà chanh">Trà chanh
            <br>
            <input type="checkbox" value="Trà lài"> Trà lài
            <br>
            <input type="checkbox" value="Trà sữa"> Trà sữa
            <br>
            <input type="button" value="Nhập" onclick="Nhap()">
            <br>
        </form>
        <script>
            function Nhap() {
                var tendn, mk;
                tendn = document.getElementById("txtus").value;
                mk = document.getElementById("txtmk").value;
                var cafe = new Array();

                var taphop = document.querySelectorAll("input[type='checkbox']");
                taphop.forEach(function(chk) {
                    if (chk.checked)
                        cafe.push(chk.value);
                });

                var gtinh;
                var taphopgt = document.querySelectorAll("input[type='radio'] ");
                taphopgt.forEach(function(ra) {
                    if (ra.checked)
                        gtinh = ra.value;
                });

                var w = window.open("infor.html");

                localStorage.setItem("us", tendn);
                localStorage.setItem("pd", mk);
                localStorage.setItem("cf", cafe);
                localStorage.setItem("gt", gtinh);
            }
        </script>

    </div>

</body>

</html>
